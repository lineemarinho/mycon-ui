name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run catalog:build

  visual:
    name: Testes visuais do catálogo
    runs-on: ubuntu-latest
    # Mesma imagem do scripts/visual-tests.sh: os prints de referência batem pixel a pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:visual --workspace=mycon-catalog
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-visual
          path: |
            apps/catalog/playwright-report
            apps/catalog/test-results
          retention-days: 14
